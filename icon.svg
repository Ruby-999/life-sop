<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="55%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <!-- Cup shape: top 64 wide, bottom 46 wide, 96 tall -->
    <path id="cup" d="M -32 -48 L 32 -48 L 25 40 Q 24 48 16 48 L -16 48 Q -24 48 -25 40 Z"/>
  </defs>

  <!-- Yellow rounded-square background -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#bg)"/>

  <!-- Sun: disc + 8 separated rays -->
  <g transform="translate(256 176)">
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
      <line x1="0" y1="-88" x2="0" y2="-64"/>
      <line x1="0" y1="88" x2="0" y2="64"/>
      <line x1="-88" y1="0" x2="-64" y2="0"/>
      <line x1="88" y1="0" x2="64" y2="0"/>
      <line x1="-62" y1="-62" x2="-45" y2="-45"/>
      <line x1="62" y1="-62" x2="45" y2="-45"/>
      <line x1="-62" y1="62" x2="-45" y2="45"/>
      <line x1="62" y1="62" x2="45" y2="45"/>
    </g>
    <circle cx="0" cy="0" r="46" fill="#FFFFFF"/>
  </g>

  <!-- 3 water glasses, fill levels 100% / 66% / 33% -->
  <g transform="translate(256 380)">
    <!-- Glass 1: full (green) -->
    <g transform="translate(-96 0)">
      <use href="#cup" fill="#FFFFFF"/>
      <clipPath id="c1"><use href="#cup"/></clipPath>
      <rect x="-36" y="-52" width="72" height="104" fill="#6FBF4F" clip-path="url(#c1)"/>
      <use href="#cup" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <!-- Glass 2: 2/3 (amber) -->
    <g transform="translate(0 0)">
      <use href="#cup" fill="#FFFFFF"/>
      <clipPath id="c2"><use href="#cup"/></clipPath>
      <rect x="-36" y="-16" width="72" height="70" fill="#FFA733" clip-path="url(#c2)"/>
      <use href="#cup" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <!-- Glass 3: 1/3 (orange) -->
    <g transform="translate(96 0)">
      <use href="#cup" fill="#FFFFFF"/>
      <clipPath id="c3"><use href="#cup"/></clipPath>
      <rect x="-36" y="16" width="72" height="40" fill="#FF8C4B" clip-path="url(#c3)"/>
      <use href="#cup" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
</svg>